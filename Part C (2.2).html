<!DOCTYPE html>
<html>
<head>
   <title>HTML Form</title>
</head>
<body>
<h1>LAB EXERCISE 2.1 HTML PART B</h1>

<form>
    Name:
    <input type="text" name="name">
    <br><br>
    Password:
    <input type="password" name="password">
    <br><br>
    Gender:
    <br>
    <input type="radio" name="gender" value="Male"> Male
    <br>
    <input type="radio" name="gender" value="Female"> Female
    <br>
    <input type="radio" name="gender" value="Other"> Other
    <br><br>
    Age:
    <select name="age">
        <option value="">Select Age</option>
        <option value="18">18</option>
        <option value="19">19</option>
        <option value="20">20</option>
        <option value="21">21</option>
    </select>
    <br><br>
    Interests:
    <br>
    <textarea name="interests" rows="4" cols="25"></textarea>
    <br><br>
    Subscribe to Newsletter:
    <input type="checkbox" name="newsletter" value="Yes">Yes
    <input type="checkbox" name="newsletter" value="No">No
    <input type="checkbox" name="newsletter" value="Not Interested">Not Interested
    <br><br>
    <input type="submit" value="Submit">
</form>
</body>
</html>
